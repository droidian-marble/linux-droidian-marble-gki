name: Build Droidian kernel (patched initramfs-tools-halium)

on:
  workflow_dispatch:

jobs:
  initramfs-tools-halium:
    name: Build patched initramfs-tools-halium
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Build patched package
        run: |
          mkdir -p "$PWD/out"

          docker run --rm --privileged \
            -v "$PWD/out:/out" \
            quay.io/droidian/build-essential:current-arm64 \
            bash -c '
              git clone --branch halium-extra-modules-hook https://github.com/droidian-marble/initramfs-tools-halium.git /tmp/initramfs-tools-halium
              cd /tmp/initramfs-tools-halium

              CI= RELENG_FULL_BUILD=yes releng-build-package

              cp ../initramfs-tools-halium_*_all.deb /out/
              cp ../linux-initramfs-halium-generic_*_arm64.deb /out/
            '

          ls -lah out

      - name: Upload patched package
        uses: actions/upload-artifact@v4
        with:
          name: patched-initramfs-tools-halium
          path: |
            out/initramfs-tools-halium_*_all.deb
            out/linux-initramfs-halium-generic_*_arm64.deb
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build Droidian kernel (patched initramfs-tools-halium)
    needs: initramfs-tools-halium
    runs-on: ubuntu-latest
    container: quay.io/droidian/build-essential:current-amd64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt update
          apt install -y curl aria2 git fakeroot build-essential ncurses-dev xz-utils libssl-dev bc flex libelf-dev bison dpkg-dev findutils android-platform-prebuilts-python-linux-x86-2.7.5 rsync kmod cpio avbtool binutils-aarch64-linux-gnu gcc-4.9-aarch64-linux-android g++-4.9-aarch64-linux-android libgcc-4.9-dev-aarch64-linux-android-cross lz4 linux-packaging-snippets clang-android-12.0-r416183b

      - name: Install package dependencies
        run: |
          rm -f debian/control
          debian/rules debian/control
          source_package=$(awk 'NR == 1 { print $1 }' debian/changelog)
          mk-build-deps --remove --install --tool "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes" debian/control
          rm -f "${source_package}"-build-deps_*.*

      - name: Download patched initramfs-tools-halium
        uses: actions/download-artifact@v4
        with:
          name: patched-initramfs-tools-halium
          path: patched-initramfs-tools-halium

      - name: Install patched initramfs-tools-halium
        run: |
          apt install -y \
            ./patched-initramfs-tools-halium/initramfs-tools-halium_*_all.deb \
            ./patched-initramfs-tools-halium/linux-initramfs-halium-generic_*_arm64.deb

      - name: Build packages
        run: |
          export PATH="/opt/android/prebuilts/python/2.7.5/bin:$PATH"
          debuild --no-lintian -F -d -sa --no-sign --jobs="$(nproc)" -aarm64

      - name: Prepare artifacts
        run: |
          mkdir -p /out /tmp/bootimage
          cp ../*.deb ../*.dsc ../*.tar.xz /out/
          bootimage_package=$(find /out -maxdepth 1 -type f -name 'linux-bootimage-*-xiaomi-marble_*_arm64.deb' -print -quit)
          test -n "$bootimage_package"
          dpkg-deb -R "$bootimage_package" /tmp/bootimage
          rm -f /tmp/bootimage/boot/recovery.img-*-xiaomi-marble
          find /tmp/bootimage -type f -not -path '/tmp/bootimage/DEBIAN/*' -exec md5sum {} + | sort -k 2 | sed 's#  /tmp/bootimage/##' > /tmp/bootimage/DEBIAN/md5sums
          rm "$bootimage_package"
          dpkg-deb -b /tmp/bootimage "$bootimage_package"
          ls -lah /out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-droidian-patched-initramfs
          path: /out/*
          if-no-files-found: error
          retention-days: 1
